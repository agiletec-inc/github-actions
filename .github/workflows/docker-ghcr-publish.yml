name: Docker Publish

# Reusable: build a multi-platform image and push to a registry (GHCR or in-cluster Zot).
# (Filename kept as docker-ghcr-publish.yml for backward-compat with existing callers.)
#   jobs:
#     publish:
#       uses: agiletec-inc/.github/.github/workflows/docker-ghcr-publish.yml@<SHA>
#       with:
#         image-name: my-image
#         registry: ghcr.io                       # or zot.zot.svc.cluster.local:5000
#         runs-on: agiletec-self-hosted-runner     # required for in-cluster Zot
#       secrets:
#         registry-username: ${{ secrets.ZOT_USER }}      # omit for GHCR
#         registry-password: ${{ secrets.ZOT_PASSWORD }}  # omit for GHCR
#
# GHCR uses GITHUB_TOKEN automatically (no secrets needed). On a pull_request the
# image is built but never pushed (dry-run gate).
on:
  workflow_call:
    inputs:
      image-name:
        description: Image name without registry/owner prefix
        type: string
        required: true
      registry:
        description: Target registry (ghcr.io or in-cluster Zot host:port)
        type: string
        default: ghcr.io
      dockerfile:
        type: string
        default: Dockerfile
      context:
        type: string
        default: .
      platforms:
        type: string
        default: linux/amd64,linux/arm64
      push:
        description: Push image (also gated off automatically on pull_request)
        type: boolean
        default: true
      runs-on:
        type: string
        default: ubuntu-latest
    secrets:
      registry-username:
        required: false
      registry-password:
        required: false

jobs:
  build-and-push:
    name: docker-publish
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        if: inputs.push && github.event_name != 'pull_request'
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.registry == 'ghcr.io' && github.actor || secrets.registry-username }}
          password: ${{ inputs.registry == 'ghcr.io' && secrets.GITHUB_TOKEN || secrets.registry-password }}
      - id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.image-name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ inputs.push && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ inputs.platforms }}
