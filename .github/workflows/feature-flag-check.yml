name: Feature flag check

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label
        type: string
        default: ubuntu-latest

jobs:
  check:
    name: check
    runs-on: ${{ inputs.runs-on }}
    container:
      image: python:3.12-bookworm
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Check out quality gate implementation
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: agiletec-inc/github-actions
          ref: main
          path: .org-quality-gate
      - name: Validate feature flags
        run: python .org-quality-gate/.github/scripts/feature_flag_check.py --root "$GITHUB_WORKSPACE"
