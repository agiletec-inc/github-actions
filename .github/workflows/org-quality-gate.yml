name: Organization quality gate

# This workflow is selected by the organization ruleset. Do not add path
# filters: a required workflow must report for every pull request and merge
# queue entry.
on:
  pull_request:
  merge_group:

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  quality-gate:
    name: quality-gate
    uses: agiletec-inc/github-actions/.github/workflows/quality-gate.yml@f5769dc3ea1b4be3b06991f0087178e34d4673b2
    with:
      source-ref: f5769dc3ea1b4be3b06991f0087178e34d4673b2
      # Every private repository uses the isolated organization-required pool.
      # Repository-specific routing would create an exception in the org gate.
      linux-runs-on: ${{ github.event.repository.private && 'org-required-ci' || 'ubuntu-latest' }}
      swift-runs-on: macos-latest
