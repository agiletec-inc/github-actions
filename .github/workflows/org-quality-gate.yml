name: Organization quality gate

# This workflow is selected by the organization ruleset. Do not add path
# filters: a required workflow must report for every pull request and merge
# queue entry.
on:
  pull_request:
  merge_group:

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  quality-gate:
    name: quality-gate
    uses: agiletec-inc/github-actions/.github/workflows/quality-gate.yml@13d2252372d742cb123e2317c5c571ee76d64746
    with:
      source-ref: 13d2252372d742cb123e2317c5c571ee76d64746
      linux-runs-on: ${{ github.event.repository.private && 'org-shared-ci-light' || 'ubuntu-latest' }}
      swift-runs-on: macos-latest
