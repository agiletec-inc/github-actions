name: Organization quality gate

# This workflow is selected by the organization ruleset. Do not add path
# filters: a required workflow must report for every pull request and merge
# queue entry.
on:
  pull_request:
  merge_group:

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  quality-gate:
    name: quality-gate
    uses: agiletec-inc/github-actions/.github/workflows/quality-gate.yml@f6d083035f7501b3385790f95c9f344cab1038e3
    with:
      source-ref: f6d083035f7501b3385790f95c9f344cab1038e3
      linux-runs-on: ${{ github.event.repository.private && 'org-shared-ci-light' || 'ubuntu-latest' }}
      swift-runs-on: macos-latest
