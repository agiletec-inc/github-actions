name: Organization quality gate

# This workflow is selected by the organization ruleset. Do not add path
# filters: a required workflow must report for every pull request and merge
# queue entry.
on:
  pull_request:
  merge_group:

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  quality-gate:
    name: quality-gate
    # A relative reusable-workflow reference follows the exact commit selected
    # by the organization ruleset instead of resolving a mutable branch again.
    uses: ./.github/workflows/quality-gate.yml
    with:
      # Every private repository uses the lightweight organization-wide pool.
      # Repository-specific routing would create an exception in the org gate.
      linux-runs-on: ${{ github.event.repository.private && 'org-shared-ci-light' || 'ubuntu-latest' }}
      swift-runs-on: macos-latest
