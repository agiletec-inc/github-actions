name: Organization quality gate

# This workflow is selected by the organization ruleset. Do not add path
# filters: a required workflow must report for every pull request and merge
# queue entry.
on:
  pull_request:
  merge_group:

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  quality-gate:
    name: quality-gate
    uses: agiletec-inc/github-actions/.github/workflows/quality-gate.yml@16a8f9b0b224c8e1483afac86ea9a00636d777d0
    with:
      source-ref: 16a8f9b0b224c8e1483afac86ea9a00636d777d0
      linux-runs-on: ${{ github.event.repository.private && 'org-shared-ci-light' || 'ubuntu-latest' }}
      swift-runs-on: macos-latest
