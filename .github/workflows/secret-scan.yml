name: Secret Scan

# Reusable: gitleaks secret detection via the pinned binary (no GITLEAKS_LICENSE
# required — the gitleaks-action needs a license for org accounts; the binary does not).
# Fails the job on any finding (real required-check, not a vacuous green).
#
#   jobs:
#     secret-scan:
#       uses: agiletec-inc/.github/.github/workflows/secret-scan.yml@<SHA>
#       with:
#         runs-on: agiletec-self-hosted-runner   # private repos; omit for public
#
# Resulting status-check name (for org ruleset "Require status checks"): "secret-scan / scan"
on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label (agiletec-self-hosted-runner for private, ubuntu-latest for public)
        type: string
        default: ubuntu-latest
      gitleaks-version:
        description: gitleaks release version (no leading v)
        type: string
        default: '8.30.1'

jobs:
  scan:
    name: scan
    runs-on: ${{ inputs.runs-on }}
    container:
      image: node:26-bookworm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: ${{ inputs.gitleaks-version }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64|amd64)  arch=x64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "::error::unsupported arch $(uname -m)"; exit 1 ;;
          esac
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          asset="gitleaks_${GITLEAKS_VERSION}_${os}_${arch}.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          echo "Downloading ${base_url}/${asset}"
          curl -fsSLO "${base_url}/${asset}"
          curl -fsSLo checksums.txt "${base_url}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "  ${asset}$" checksums.txt | sha256sum -c -
          tar -xzf "${asset}" gitleaks
          ./gitleaks version
          config_args=()
          if [ -f .gitleaks.toml ]; then
            config_args=(--config .gitleaks.toml)
            echo "Using repository .gitleaks.toml configuration."
          fi
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              ./gitleaks git "${config_args[@]}" --redact --no-banner --exit-code 1 --verbose \
                --log-opts "${{ github.event.pull_request.base.sha }}..HEAD" .
              ;;
            merge_group)
              ./gitleaks git "${config_args[@]}" --redact --no-banner --exit-code 1 --verbose \
                --log-opts "${{ github.event.merge_group.base_sha }}..HEAD" .
              ;;
            push)
              if [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
                ./gitleaks dir . "${config_args[@]}" --redact --no-banner --exit-code 1 --verbose
              else
                ./gitleaks git "${config_args[@]}" --redact --no-banner --exit-code 1 --verbose \
                  --log-opts "${{ github.event.before }}..${{ github.sha }}" .
              fi
              ;;
            *)
              ./gitleaks dir . "${config_args[@]}" --redact --no-banner --exit-code 1 --verbose
              ;;
          esac
