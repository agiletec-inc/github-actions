name: Organization quality gate

# Reusable organization-wide gate. The caller workflow must always start on
# pull_request and merge_group; use job-level conditions here, never workflow
# path filters, so required checks are reported for every pull request.
on:
  workflow_call:
    inputs:
      linux-runs-on:
        description: Linux runner label for detection and Linux quality jobs
        type: string
        default: ubuntu-latest
      swift-runs-on:
        description: macOS runner label for Swift quality jobs
        type: string
        default: macos-latest

permissions:
  contents: read

jobs:
  detect:
    name: detect
    runs-on: ${{ inputs.linux-runs-on }}
    container:
      image: node:26-bookworm
    outputs:
      node: ${{ steps.detect.outputs.node }}
      node_version: ${{ steps.detect.outputs.node_version }}
      node_run_command: ${{ steps.detect.outputs.node_run_command }}
      bun: ${{ steps.detect.outputs.bun }}
      python: ${{ steps.detect.outputs.python }}
      python_directory: ${{ steps.detect.outputs.python_directory }}
      rust: ${{ steps.detect.outputs.rust }}
      swift: ${{ steps.detect.outputs.swift }}
      swift_directory: ${{ steps.detect.outputs.swift_directory }}
      supported: ${{ steps.detect.outputs.supported }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - id: detect
        name: Detect repository stacks
        shell: bash
        run: |
          set -euo pipefail

          has_root_file() {
            test -f "$1"
          }

          node=false
          node_version=22
          node_run_command=''
          bun=false
          python=false
          python_directory=.
          rust=false
          swift=false
          swift_directory=.
          if has_root_file package.json; then
            if has_root_file bun.lock || has_root_file bun.lockb; then
              bun=true
            else
              node=true
              node_version="$(node -e "const pkg=require('./package.json'); const match=(pkg.engines?.node ?? '').match(/(?:^|[^0-9])(\\d{2,})(?:\\D|$)/); console.log(match?.[1] ?? '22')")"
              scripts="$(node -e "console.log(JSON.stringify(require('./package.json').scripts ?? {}))")"
              if [ "$(node -e "const scripts=JSON.parse(process.argv[1]); console.log(Boolean(scripts.check) && !scripts.lint)" "$scripts")" = true ]; then
                if has_root_file pnpm-lock.yaml; then
                  node_run_command='pnpm check'
                elif has_root_file yarn.lock; then
                  node_run_command='yarn check'
                else
                  node_run_command='npm run check'
                fi
              fi
            fi
          fi
          if has_root_file pyproject.toml || has_root_file setup.py || has_root_file requirements.txt; then
            python=true
          elif [ -f apps/api/pyproject.toml ]; then
            python=true
            python_directory=apps/api
          else
            python_project="$(find . -maxdepth 3 \
              -path '*/.git' -prune -o \
              -path '*/.venv' -prune -o \
              -path '*/node_modules' -prune -o \
              -type f -name pyproject.toml \
              -print -quit)"
            if [ -n "$python_project" ]; then
              python=true
              python_directory="$(dirname "$python_project")"
            fi
          fi
          has_root_file Cargo.toml && rust=true
          swift_project="$(find . -maxdepth 3 \
            -path '*/.git' -prune -o \
            -path '*/.build' -prune -o \
            -path '*/build' -prune -o \
            -type f -name Package.swift \
            -print -quit)"
          if [ -n "$swift_project" ]; then
            swift=true
            swift_directory="$(dirname "$swift_project")"
          fi
          supported=false
          if [ "$node" = true ] || [ "$bun" = true ] || [ "$python" = true ] || [ "$rust" = true ] || [ "$swift" = true ]; then
            supported=true
          fi

          {
            echo "node=$node"
            echo "node_version=$node_version"
            echo "node_run_command=$node_run_command"
            echo "bun=$bun"
            echo "python=$python"
            echo "python_directory=$python_directory"
            echo "rust=$rust"
            echo "swift=$swift"
            echo "swift_directory=$swift_directory"
            echo "supported=$supported"
          } >> "$GITHUB_OUTPUT"
          printf 'node=%s\nnode_version=%s\nnode_run_command=%s\nbun=%s\npython=%s\npython_directory=%s\nrust=%s\nswift=%s\nswift_directory=%s\nsupported=%s\n' "$node" "$node_version" "$node_run_command" "$bun" "$python" "$python_directory" "$rust" "$swift" "$swift_directory" "$supported"

  node-ci:
    name: node-ci
    needs: detect
    if: ${{ needs.detect.outputs.node == 'true' }}
    uses: ./.github/workflows/node-pnpm-ci.yml
    with:
      runs-on: ${{ inputs.linux-runs-on }}
      node-version: ${{ needs.detect.outputs.node_version }}
      run-command: ${{ needs.detect.outputs.node_run_command }}

  bun-ci:
    name: bun-ci
    needs: detect
    if: ${{ needs.detect.outputs.bun == 'true' }}
    uses: ./.github/workflows/bun-ci.yml
    with:
      runs-on: ${{ inputs.linux-runs-on }}

  python-ci:
    name: python-ci
    needs: detect
    if: ${{ needs.detect.outputs.python == 'true' }}
    uses: ./.github/workflows/python-ci.yml
    with:
      runs-on: ${{ inputs.linux-runs-on }}
      tool: auto
      working-directory: ${{ needs.detect.outputs.python_directory }}

  rust-ci:
    name: rust-ci
    needs: detect
    if: ${{ needs.detect.outputs.rust == 'true' }}
    uses: ./.github/workflows/rust-cargo-ci.yml
    with:
      runs-on: ${{ inputs.linux-runs-on }}

  swift-ci:
    name: swift-ci
    needs: detect
    # Capability condition, not a repo special case: the Swift toolchain needs
    # macOS, the org has no self-hosted macOS runner, and GitHub-hosted runners
    # are blocked for private repos (zero spending limit) — the job would fail
    # at assignment before running a single step. Public repos keep the gate.
    if: ${{ needs.detect.outputs.swift == 'true' && !github.event.repository.private }}
    uses: ./.github/workflows/swift-ci.yml
    with:
      runs-on: ${{ inputs.swift-runs-on }}
      working-directory: ${{ needs.detect.outputs.swift_directory }}

  secret-scan:
    name: secret-scan
    uses: ./.github/workflows/secret-scan.yml
    with:
      runs-on: ${{ inputs.linux-runs-on }}

  feature-flag-check:
    name: feature-flag-check
    uses: ./.github/workflows/feature-flag-check.yml
    with:
      runs-on: ${{ inputs.linux-runs-on }}

  quality-gate:
    name: quality-gate
    needs: [detect, node-ci, bun-ci, python-ci, rust-ci, swift-ci, secret-scan, feature-flag-check]
    if: ${{ always() }}
    runs-on: ${{ inputs.linux-runs-on }}
    container:
      image: node:26-bookworm
    steps:
      - name: Reject failed or cancelled jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.NEEDS);
          const failed = Object.entries(needs)
            .filter(([, result]) => result.result === 'failure' || result.result === 'cancelled')
            .map(([name, result]) => `${name}=${result.result}`);

          if (failed.length > 0) {
            console.error(`Quality gate failed: ${failed.join(', ')}`);
            process.exit(1);
          }

          console.log('Quality gate passed: all applicable jobs succeeded or were skipped.');
          NODE
