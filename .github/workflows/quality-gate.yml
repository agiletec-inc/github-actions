name: Organization quality gate

# Reusable organization-wide gate. The caller workflow must always start on
# pull_request and merge_group; use job-level conditions here, never workflow
# path filters, so required checks are reported for every pull request.
on:
  workflow_call:
    inputs:
      linux-runs-on:
        description: Linux runner label for detection and Linux quality jobs
        type: string
        default: ubuntu-latest
      swift-runs-on:
        description: macOS runner label for Swift quality jobs
        type: string
        default: macos-latest
      source-ref:
        description: Immutable github-actions revision used by every implementation checkout
        type: string
        default: main

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  detect:
    name: detect
    runs-on: ${{ inputs.linux-runs-on }}
    container:
      image: node:26-bookworm
    outputs:
      node: ${{ steps.detect.outputs.node }}
      node_version: ${{ steps.detect.outputs.node_version }}
      node_run_command: ${{ steps.detect.outputs.node_run_command }}
      bun: ${{ steps.detect.outputs.bun }}
      python: ${{ steps.detect.outputs.python }}
      python_directory: ${{ steps.detect.outputs.python_directory }}
      rust: ${{ steps.detect.outputs.rust }}
      swift: ${{ steps.detect.outputs.swift }}
      swift_directory: ${{ steps.detect.outputs.swift_directory }}
      supported: ${{ steps.detect.outputs.supported }}
      deno: ${{ steps.detect.outputs.deno }}
      supabase: ${{ steps.detect.outputs.supabase }}
      docker: ${{ steps.detect.outputs.docker }}
      dependency_audit: ${{ steps.detect.outputs.dependency_audit }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      heavy: ${{ steps.scope.outputs.heavy }}
      secret_scan: ${{ steps.scope.outputs.secret_scan }}
      required_contexts: ${{ steps.native.outputs.required_contexts }}
      native_required: ${{ steps.native.outputs.required_contexts != '[]' }}
      source_sha: ${{ steps.resolve-source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Fetch gate comparison revisions
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Unable to resolve gate comparison revisions.' >&2
            exit 1
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
      - name: Check out quality gate implementation
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: agiletec-inc/github-actions
          ref: ${{ inputs.source-ref }}
          path: .quality-gate-source
      - id: resolve-source
        name: Resolve quality gate implementation revision
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git -C .quality-gate-source rev-parse HEAD)"
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Unable to resolve agiletec-inc/github-actions source revision.' >&2
            exit 1
          fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
      - id: detect
        name: Detect repository stacks
        shell: bash
        run: bash .quality-gate-source/.github/scripts/detect_capabilities.sh .
      - id: scope
        name: Detect documentation-only changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || 'unknown' }}
          HEAD_SHA: ${{ github.sha }}
        run: bash .quality-gate-source/.github/scripts/docs_only.sh . "$BASE_SHA" "$HEAD_SHA"
      - id: native
        name: Detect repository-native required checks
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.sha }}
          # From the pull_request event context only, never repository file
          # content, so a head cannot self-authorize by editing tracked files.
          # merge_group events carry no labels, so this is empty there.
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: bash .quality-gate-source/.github/scripts/detect_native_gates.sh . "$BASE_SHA" "$HEAD_SHA"

  node-ci:
    name: node-ci
    needs: detect
    if: ${{ needs.detect.outputs.node == 'true' && needs.detect.outputs.heavy == 'true' && needs.detect.outputs.native_required != 'true' }}
    uses: ./.github/workflows/node-pnpm-ci.yml
    with:
      runs-on: ${{ inputs.linux-runs-on }}
      node-version: ${{ needs.detect.outputs.node_version }}
      run-command: ${{ needs.detect.outputs.node_run_command }}

  bun-ci:
    name: bun-ci
    needs: detect
    if: ${{ needs.detect.outputs.bun == 'true' && needs.detect.outputs.heavy == 'true' && needs.detect.outputs.native_required != 'true' }}
    uses: ./.github/workflows/bun-ci.yml
    with:
      runs-on: ${{ inputs.linux-runs-on }}

  python-ci:
    name: python-ci
    needs: detect
    if: ${{ needs.detect.outputs.python == 'true' && needs.detect.outputs.heavy == 'true' && needs.detect.outputs.native_required != 'true' }}
    uses: ./.github/workflows/python-ci.yml
    with:
      runs-on: ${{ inputs.linux-runs-on }}
      tool: auto
      working-directory: ${{ needs.detect.outputs.python_directory }}

  rust-ci:
    name: rust-ci
    needs: detect
    if: ${{ needs.detect.outputs.rust == 'true' && needs.detect.outputs.heavy == 'true' && needs.detect.outputs.native_required != 'true' }}
    uses: ./.github/workflows/rust-cargo-ci.yml
    with:
      runs-on: ${{ inputs.linux-runs-on }}

  swift-ci:
    name: swift-ci
    needs: detect
    # Capability condition, not a repo special case: the Swift toolchain needs
    # macOS, the org has no self-hosted macOS runner, and GitHub-hosted runners
    # are blocked for private repos (zero spending limit) — the job would fail
    # at assignment before running a single step. Public repos keep the gate.
    if: ${{ needs.detect.outputs.swift == 'true' && needs.detect.outputs.heavy == 'true' && needs.detect.outputs.native_required != 'true' && !github.event.repository.private }}
    uses: ./.github/workflows/swift-ci.yml
    with:
      runs-on: ${{ inputs.swift-runs-on }}
      working-directory: ${{ needs.detect.outputs.swift_directory }}

  secret-scan:
    name: secret-scan
    needs: detect
    if: ${{ needs.detect.outputs.native_required != 'true' }}
    uses: ./.github/workflows/secret-scan.yml
    with:
      runs-on: ${{ inputs.linux-runs-on }}

  feature-flag-check:
    name: feature-flag-check
    needs: detect
    if: ${{ needs.detect.outputs.heavy == 'true' && needs.detect.outputs.native_required != 'true' }}
    uses: ./.github/workflows/feature-flag-check.yml
    with:
      runs-on: ${{ inputs.linux-runs-on }}

  repository-gates:
    name: repository-gates
    needs: detect
    if: ${{ needs.detect.outputs.required_contexts != '[]' }}
    runs-on: ${{ inputs.linux-runs-on }}
    container:
      image: node:26-bookworm
    steps:
      - name: Check out quality gate implementation
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: agiletec-inc/github-actions
          ref: ${{ needs.detect.outputs.source_sha }}
          path: .quality-gate-source
      - name: Wait for repository-native required checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REQUIRED_CONTEXTS: ${{ needs.detect.outputs.required_contexts }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail
          deadline=$((SECONDS + 900))

          while [ "$SECONDS" -lt "$deadline" ]; do
            CHECK_RUNS="$(node - <<'NODE'
          const { GH_TOKEN, REPOSITORY, TARGET_SHA } = process.env;
          const url = `https://api.github.com/repos/${REPOSITORY}/commits/${TARGET_SHA}/check-runs?filter=latest&per_page=100`;
          const response = await fetch(url, {
            headers: {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${GH_TOKEN}`,
              'X-GitHub-Api-Version': '2026-03-10',
            },
          });
          if (!response.ok) {
            throw new Error(`GitHub checks API returned ${response.status}`);
          }
          const payload = await response.json();
          const runIds = new Map();
          for (const checkRun of payload.check_runs ?? []) {
            const match = checkRun.details_url?.match(/\/actions\/runs\/(\d+)(?:\/|$)/);
            if (match) runIds.set(match[1], null);
          }
          for (const runId of runIds.keys()) {
            const runResponse = await fetch(`https://api.github.com/repos/${REPOSITORY}/actions/runs/${runId}`, {
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${GH_TOKEN}`,
                'X-GitHub-Api-Version': '2026-03-10',
              },
            });
            if (!runResponse.ok) throw new Error(`GitHub Actions API returned ${runResponse.status}`);
            runIds.set(runId, (await runResponse.json()).path ?? null);
          }
          const enriched = (payload.check_runs ?? []).map(checkRun => {
            const match = checkRun.details_url?.match(/\/actions\/runs\/(\d+)(?:\/|$)/);
            return {
              id: checkRun.id,
              name: checkRun.name,
              status: checkRun.status,
              conclusion: checkRun.conclusion,
              workflow_path: match ? runIds.get(match[1]) ?? null : null,
            };
          });
          process.stdout.write(JSON.stringify(enriched));
          NODE
            )"
            fetch_status=$?

            if [ "$fetch_status" -eq 0 ]; then
              if CHECK_RUNS="$CHECK_RUNS" node .quality-gate-source/.github/scripts/evaluate_required_checks.mjs; then
                exit 0
              else
                evaluation_status=$?
              fi
              if [ "$evaluation_status" -ne 75 ]; then
                exit "$evaluation_status"
              fi
            else
              echo 'Unable to read check-runs; retrying until the fail-closed timeout.' >&2
            fi

            sleep 15
          done

          echo 'Timed out waiting for repository-native required checks.' >&2
          exit 1

  quality-gate:
    name: quality-gate
    needs: [detect, node-ci, bun-ci, python-ci, rust-ci, swift-ci, secret-scan, feature-flag-check, repository-gates]
    if: ${{ always() }}
    runs-on: ${{ inputs.linux-runs-on }}
    container:
      image: node:26-bookworm
    steps:
      - name: Check out quality gate implementation
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: agiletec-inc/github-actions
          ref: ${{ needs.detect.outputs.source_sha }}
          path: .quality-gate-source
      - name: Evaluate applicable jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
          DETECTED: >-
            {"node-ci": ${{ needs.detect.outputs.node == 'true' && needs.detect.outputs.heavy == 'true' }},
             "bun-ci": ${{ needs.detect.outputs.bun == 'true' && needs.detect.outputs.heavy == 'true' }},
             "python-ci": ${{ needs.detect.outputs.python == 'true' && needs.detect.outputs.heavy == 'true' }},
             "rust-ci": ${{ needs.detect.outputs.rust == 'true' && needs.detect.outputs.heavy == 'true' }},
            "swift-ci": ${{ needs.detect.outputs.swift == 'true' && needs.detect.outputs.heavy == 'true' && needs.detect.outputs.native_required != 'true' && !github.event.repository.private }},
            "secret-scan": ${{ needs.detect.outputs.native_required != 'true' }},
             "feature-flag-check": ${{ needs.detect.outputs.heavy == 'true' && needs.detect.outputs.native_required != 'true' }},
             "repository-gates": ${{ needs.detect.outputs.required_contexts != '[]' }}}
        run: node .quality-gate-source/.github/scripts/evaluate_quality_gate.mjs
