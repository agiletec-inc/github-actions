name: Organization quality gate

# Reusable organization-wide gate. The caller workflow must always start on
# pull_request and merge_group; use job-level conditions here, never workflow
# path filters, so required checks are reported for every pull request.
on:
  workflow_call:
    inputs:
      linux-runs-on:
        description: Linux runner label for detection and Linux quality jobs
        type: string
        default: ubuntu-latest
      swift-runs-on:
        description: macOS runner label for Swift quality jobs
        type: string
        default: macos-latest

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  detect:
    name: detect
    runs-on: ${{ inputs.linux-runs-on }}
    container:
      image: node:26-bookworm
    outputs:
      node: ${{ steps.detect.outputs.node }}
      node_version: ${{ steps.detect.outputs.node_version }}
      node_run_command: ${{ steps.detect.outputs.node_run_command }}
      bun: ${{ steps.detect.outputs.bun }}
      python: ${{ steps.detect.outputs.python }}
      python_directory: ${{ steps.detect.outputs.python_directory }}
      rust: ${{ steps.detect.outputs.rust }}
      swift: ${{ steps.detect.outputs.swift }}
      swift_directory: ${{ steps.detect.outputs.swift_directory }}
      supported: ${{ steps.detect.outputs.supported }}
      deno: ${{ steps.detect.outputs.deno }}
      supabase: ${{ steps.detect.outputs.supabase }}
      docker: ${{ steps.detect.outputs.docker }}
      dependency_audit: ${{ steps.detect.outputs.dependency_audit }}
      docs_only: ${{ steps.detect.outputs.docs_only }}
      heavy: ${{ steps.detect.outputs.heavy }}
      secret_scan: ${{ steps.detect.outputs.secret_scan }}
      required_contexts: ${{ steps.detect.outputs.required_contexts }}
      native_required: ${{ steps.detect.outputs.native_required }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Fetch gate comparison revisions
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Unable to resolve gate comparison revisions.' >&2
            exit 1
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
      - id: detect
        name: Detect quality gate capabilities
        uses: agiletec-inc/github-actions/.github/actions/detect@bc8d3af3f29651286df2ccff0063658ceacff5fb
        with:
          repository-path: .
          base-sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          head-sha: ${{ github.sha }}

  node-ci:
    name: node-ci
    needs: detect
    if: ${{ needs.detect.outputs.node == 'true' && needs.detect.outputs.heavy == 'true' && needs.detect.outputs.native_required != 'true' }}
    uses: ./.github/workflows/node-pnpm-ci.yml
    with:
      runs-on: ${{ inputs.linux-runs-on }}
      node-version: ${{ needs.detect.outputs.node_version }}
      run-command: ${{ needs.detect.outputs.node_run_command }}

  bun-ci:
    name: bun-ci
    needs: detect
    if: ${{ needs.detect.outputs.bun == 'true' && needs.detect.outputs.heavy == 'true' && needs.detect.outputs.native_required != 'true' }}
    uses: ./.github/workflows/bun-ci.yml
    with:
      runs-on: ${{ inputs.linux-runs-on }}

  python-ci:
    name: python-ci
    needs: detect
    if: ${{ needs.detect.outputs.python == 'true' && needs.detect.outputs.heavy == 'true' && needs.detect.outputs.native_required != 'true' }}
    uses: ./.github/workflows/python-ci.yml
    with:
      runs-on: ${{ inputs.linux-runs-on }}
      tool: auto
      working-directory: ${{ needs.detect.outputs.python_directory }}

  rust-ci:
    name: rust-ci
    needs: detect
    if: ${{ needs.detect.outputs.rust == 'true' && needs.detect.outputs.heavy == 'true' && needs.detect.outputs.native_required != 'true' }}
    uses: ./.github/workflows/rust-cargo-ci.yml
    with:
      runs-on: ${{ inputs.linux-runs-on }}

  swift-ci:
    name: swift-ci
    needs: detect
    # Capability condition, not a repo special case: the Swift toolchain needs
    # macOS, the org has no self-hosted macOS runner, and GitHub-hosted runners
    # are blocked for private repos (zero spending limit) — the job would fail
    # at assignment before running a single step. Public repos keep the gate.
    if: ${{ needs.detect.outputs.swift == 'true' && needs.detect.outputs.heavy == 'true' && needs.detect.outputs.native_required != 'true' && !github.event.repository.private }}
    uses: ./.github/workflows/swift-ci.yml
    with:
      runs-on: ${{ inputs.swift-runs-on }}
      working-directory: ${{ needs.detect.outputs.swift_directory }}

  secret-scan:
    name: secret-scan
    needs: detect
    if: ${{ needs.detect.outputs.native_required != 'true' }}
    uses: ./.github/workflows/secret-scan.yml
    with:
      runs-on: ${{ inputs.linux-runs-on }}

  feature-flag-check:
    name: feature-flag-check
    needs: detect
    if: ${{ needs.detect.outputs.heavy == 'true' && needs.detect.outputs.native_required != 'true' }}
    uses: ./.github/workflows/feature-flag-check.yml
    with:
      runs-on: ${{ inputs.linux-runs-on }}

  quality-gate:
    name: quality-gate
    needs: [detect, node-ci, bun-ci, python-ci, rust-ci, swift-ci, secret-scan, feature-flag-check]
    if: ${{ always() }}
    runs-on: ${{ inputs.linux-runs-on }}
    container:
      image: node:26-bookworm
    steps:
      - name: Evaluate applicable jobs
        uses: agiletec-inc/github-actions/.github/actions/evaluate@bc8d3af3f29651286df2ccff0063658ceacff5fb
        with:
          needs: ${{ toJSON(needs) }}
          detected: >-
            {"node-ci": ${{ needs.detect.outputs.node == 'true' && needs.detect.outputs.heavy == 'true' && needs.detect.outputs.native_required != 'true' }},
             "bun-ci": ${{ needs.detect.outputs.bun == 'true' && needs.detect.outputs.heavy == 'true' && needs.detect.outputs.native_required != 'true' }},
             "python-ci": ${{ needs.detect.outputs.python == 'true' && needs.detect.outputs.heavy == 'true' && needs.detect.outputs.native_required != 'true' }},
             "rust-ci": ${{ needs.detect.outputs.rust == 'true' && needs.detect.outputs.heavy == 'true' && needs.detect.outputs.native_required != 'true' }},
            "swift-ci": ${{ needs.detect.outputs.swift == 'true' && needs.detect.outputs.heavy == 'true' && needs.detect.outputs.native_required != 'true' && !github.event.repository.private }},
            "secret-scan": ${{ needs.detect.outputs.native_required != 'true' }},
             "feature-flag-check": ${{ needs.detect.outputs.heavy == 'true' && needs.detect.outputs.native_required != 'true' }}}
