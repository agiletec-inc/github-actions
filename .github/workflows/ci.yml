name: Reusable workflow CI

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    container:
      image: node:26-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run gate contract tests
        run: python3 -m unittest discover -s tests
      - name: Validate shell and JavaScript syntax
        run: |
          bash -n .github/scripts/*.sh
          node --check .github/scripts/*.mjs
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.25.x
      - name: Validate workflows with pinned actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
