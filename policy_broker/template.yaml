AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Sign-only GitHub organization Ruleset workflow pin broker

Parameters:
  GitHubAppId:
    Type: String
  GitHubInstallationId:
    Type: String
  KmsKeyArn:
    Type: String
  SourceRepositoryId:
    Type: Number
  ApplyEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']

Resources:
  BrokerAudit:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: audit_id
          AttributeType: S
      KeySchema:
        - AttributeName: audit_id
          KeyType: HASH

  RulesetPinBroker:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.14
      Handler: policy_broker.ruleset_pin_broker.lambda_handler
      CodeUri: ..
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          GITHUB_APP_ID: !Ref GitHubAppId
          GITHUB_INSTALLATION_ID: !Ref GitHubInstallationId
          KMS_KEY_ARN: !Ref KmsKeyArn
          SOURCE_REPOSITORY_ID: !Ref SourceRepositoryId
          AUDIT_TABLE: !Ref BrokerAudit
          APPLY_ENABLED: !Ref ApplyEnabled
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action: kms:Sign
              Resource: !Ref KmsKeyArn
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt BrokerAudit.Arn
